name: Build and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:BuildNumber=${{ github.run_number }}

      - name: Test
        run: dotnet test --no-build -c Release

  deploy-web:
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Set the base href before publishing so the service worker's integrity hashes match the served index.html.
      - name: Set base href for GitHub Pages
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' src/ChangeAnalyst/wwwroot/index.html

      - name: Publish
        run: dotnet publish src/ChangeAnalyst -c Release -o publish -p:BuildNumber=${{ github.run_number }}

      - name: Prepare for GitHub Pages
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-api:
    # Runs once the Azure repository variables are set (see README).
    if: github.event_name != 'pull_request' && vars.AZURE_FUNCTIONAPP_NAME != ''
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/ChangeAnalyst.Api -c Release -o api-publish -p:BuildNumber=${{ github.run_number }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: api-publish
          sku: flexconsumption
